<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="mobile-web-app-capable" content="yes">
<title>Expenses</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --bg:#000000;
    --card:#1c1c1e;
    --card-2:#2c2c2e;
    --line:#38383a;
    --text:#ffffff;
    --muted:#8e8e93;
    --accent:#30d158;
    --accent-dim:#1e3d28;
    --cash:#ff9f0a;
    --gpay:#0a84ff;
    --paytm:#64d2ff;
    --slice:#ff375f;
    --other:#bf5af2;
    --danger:#ff453a;
    --shadow:none;
  }
  body.light{
    --bg:#f2f2f7;
    --card:#ffffff;
    --card-2:#e5e5ea;
    --line:#d1d1d6;
    --text:#000000;
    --muted:#6e6e73;
    --accent:#248a3d;
    --accent-dim:#d1f2db;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{height:100%; overscroll-behavior:none;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior-y:none;
    min-height:100%;
  }
  input, select, textarea{-webkit-user-select:text; user-select:text;}

  header{
    padding:22px 20px 14px;
    padding-top:calc(22px + env(safe-area-inset-top));
    position:sticky; top:0;
    z-index:5;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  header h1{margin:0; font-size:20px; font-weight:700; letter-spacing:0.2px;}
  header p{margin:4px 0 0; color:var(--muted); font-size:13px;}

  .theme-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    position:absolute;
    top:calc(22px + env(safe-area-inset-top));
    right:20px;
  }
  .theme-toggle .icon{font-size:13px;}
  .switch{
    width:44px;
    height:25px;
    border-radius:20px;
    background:var(--card-2);
    border:1px solid var(--line);
    position:relative;
    cursor:pointer;
    flex-shrink:0;
  }
  .switch .knob{
    position:absolute;
    top:2px; left:2px;
    width:19px; height:19px;
    border-radius:50%;
    background:var(--accent);
    transition:left 0.25s ease;
  }
  body.light .switch .knob{left:23px;}

  .totals{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:14px 20px 4px;
  }
  .total-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
  }
  .total-card.main{
    grid-column:1 / -1;
    background:var(--card);
    border-color:var(--line);
  }
  .total-card .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
  .total-card .value{font-size:18px; font-weight:700; margin-top:2px;}
  .total-card.main .value{font-size:22px; color:var(--accent);}
  .total-card .sub{font-size:11px; color:var(--muted); margin-top:1px;}

  form{
    margin:18px 20px 6px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
  }
  .row{display:flex; gap:10px; margin-bottom:10px;}
  .field{flex:1 1 0; width:0; display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
  input, select{
    background:var(--card-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:9px 11px;
    font-size:14px;
    width:100%;
    font-family:inherit;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  #date{padding:7px 9px; font-size:13px;}

  .mode-group{display:flex; gap:8px; flex-wrap:wrap;}
  .mode-btn{
    flex:1 1 30%;
    min-width:80px;
    padding:10px 6px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card-2);
    color:var(--muted);
    font-size:13.5px;
    text-align:center;
    cursor:pointer;
    font-weight:600;
  }
  .mode-btn.selected[data-mode="GPay"]{background:rgba(10,132,255,0.15); border-color:var(--gpay); color:var(--gpay);}
  .mode-btn.selected[data-mode="Cash"]{background:rgba(255,159,10,0.15); border-color:var(--cash); color:var(--cash);}
  .mode-btn.selected[data-mode="Paytm"]{background:rgba(100,210,255,0.15); border-color:var(--paytm); color:var(--paytm);}
  .mode-btn.selected[data-mode="Card"]{background:rgba(255,55,95,0.15); border-color:var(--slice); color:var(--slice);}
  .mode-btn.selected[data-mode="Other"]{background:rgba(191,90,242,0.15); border-color:var(--other); color:var(--other);}

  .add-btn{
    width:100%;
    margin-top:6px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#000;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
  }
  .add-btn:active{opacity:0.8;}

  .history-btn{
    width:calc(100% - 40px);
    margin:14px 20px 0;
    padding:13px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .history-btn .count{
    background:var(--card-2);
    color:var(--muted);
    font-size:12px;
    padding:2px 8px;
    border-radius:20px;
  }

  .history-panel{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:var(--bg);
    z-index:20;
    transform:translateX(100%);
    transition:transform 0.25s ease;
    overflow-y:auto;
  }
  .history-panel.open{transform:translateX(0);}
  .history-top{
    position:sticky;
    top:0;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:18px 20px 12px;
    padding-top:calc(18px + env(safe-area-inset-top));
    display:flex;
    align-items:center;
    gap:12px;
    z-index:2;
  }
  .back-btn{
    width:34px; height:34px;
    border-radius:8px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--text);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .history-top h2{margin:0; font-size:18px; font-weight:700;}

  .history-total{
    margin:16px 20px 0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    text-align:center;
  }
  .history-total .label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
  .history-total .value{font-size:26px; font-weight:700; color:var(--accent); margin-top:4px;}

  .cat-breakdown{
    margin:12px 20px 0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px 16px;
  }
  .cat-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .cat-row:last-child{border-bottom:none;}
  .cat-row .cat-name{font-size:14px; font-weight:600;}
  .cat-row .cat-right{display:flex; align-items:center; gap:10px;}
  .cat-row .cat-amt{font-size:14.5px; font-weight:700; font-variant-numeric:tabular-nums;}
  .cat-row .cat-pct{font-size:11.5px; color:var(--muted); min-width:34px; text-align:right;}
  .cat-bar-bg{
    height:4px;
    background:var(--card-2);
    border-radius:4px;
    margin-top:6px;
    overflow:hidden;
  }
  .cat-bar-fill{
    height:100%;
    background:var(--accent);
    border-radius:4px;
  }

  .backup-row{display:flex; gap:10px; margin:12px 20px 0;}
  .backup-btn{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .backup-btn:active{opacity:0.8;}

  .modal-overlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.5);
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .modal-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    max-width:320px;
    width:100%;
  }
  .modal-box p{margin:0 0 16px; font-size:14.5px; line-height:1.5; color:var(--text);}
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{
    flex:1;
    padding:11px;
    border-radius:8px;
    border:1px solid var(--line);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .modal-actions .m-primary{background:var(--accent); color:#000; border:none;}
  .modal-actions .m-secondary{background:var(--card-2); color:var(--text);}
  .modal-actions .m-single{background:var(--accent); color:#000; border:none;}

  .list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:16px 20px 8px;
  }
  .list-header h2{font-size:15px; margin:0; color:var(--muted); font-weight:600; letter-spacing:0.3px;}
  .list-header input{width:auto; max-width:130px; font-size:13px; padding:7px 11px;}

  .entries{margin:0 20px;}
  .day-group{margin-bottom:14px;}
  .day-label{
    font-size:12px;
    color:var(--muted);
    margin:10px 0 6px;
    display:grid;
    grid-template-columns:8px minmax(0,1fr) minmax(58px,auto) 20px;
    align-items:center;
    column-gap:10px;
  }
  .day-label span:first-child{grid-column:2;}
  .day-label span:last-child{grid-column:3; text-align:right; font-variant-numeric:tabular-nums;}
  .entry{
    display:grid;
    grid-template-columns:8px minmax(0,1fr) minmax(58px,auto) 20px;
    align-items:center;
    column-gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .entry .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .dot.GPay{background:var(--gpay);}
  .dot.Cash{background:var(--cash);}
  .dot.Paytm{background:var(--paytm);}
  .dot.Card{background:var(--slice);}
  .dot.Other{background:var(--other);}
  .entry .info{min-width:0;}
  .entry .info .note{font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry .info .meta{font-size:12px; color:var(--muted); margin-top:2px; display:flex; align-items:center; gap:6px;}
  .entry .info .meta .cat{
    background:var(--card-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:1px 7px;
    border-radius:6px;
    font-size:11px;
    font-weight:600;
  }
  .entry .amount{
    font-size:15.5px;
    font-weight:700;
    text-align:right;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .entry .del{
    color:var(--danger);
    font-size:18px;
    text-align:center;
    cursor:pointer;
  }
  .empty{text-align:center; color:var(--muted); font-size:14px; padding:40px 20px;}
</style>
</head>
<body>

<header>
  <h1>Expenses</h1>
  <p>Track what you spend, saved on this device</p>
  <div class="theme-toggle">
    <span class="icon">☀️</span>
    <div class="switch" id="themeSwitch"><div class="knob"></div></div>
    <span class="icon">🌙</span>
  </div>
</header>

<div class="totals">
  <div class="total-card main">
    <div class="label">Total spent</div>
    <div class="value" id="totalAll">₹0</div>
    <div class="sub" id="totalCount">0 entries</div>
  </div>
  <div class="total-card">
    <div class="label">This month</div>
    <div class="value" id="totalMonth">₹0</div>
  </div>
  <div class="total-card">
    <div class="label">Today</div>
    <div class="value" id="totalToday">₹0</div>
  </div>
</div>

<form id="entryForm">
  <div class="row">
    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date" required>
    </div>
    <div class="field">
      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" class="amount-input" placeholder="0" min="0" step="0.01" inputmode="decimal" required>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="category">Category</label>
      <select id="category"></select>
    </div>
    <div class="field">
      <label for="note">Details</label>
      <input type="text" id="note" placeholder="e.g. Lunch, groceries..." required>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Paid via</label>
      <div class="mode-group" id="modeGroup">
        <div class="mode-btn selected" data-mode="GPay">GPay</div>
        <div class="mode-btn" data-mode="Cash">Cash</div>
        <div class="mode-btn" data-mode="Paytm">Paytm</div>
        <div class="mode-btn" data-mode="Card">Credit Card</div>
        <div class="mode-btn" data-mode="Other">Other</div>
      </div>
    </div>
  </div>
  <button type="submit" class="add-btn">Add expense</button>
</form>

<button class="history-btn" id="openHistory">
  📋 View History <span class="count" id="historyCount">0 entries</span>
</button>

<div class="backup-row" style="margin:14px 20px 0;">
  <button class="history-btn" id="mainBackupBtn" style="margin:0;">⬇ Backup</button>
  <button class="history-btn" id="mainImportBtn" style="margin:0;">⬆ Restore</button>
</div>
<input type="file" id="mainImportFile" accept="application/json" style="display:none;">

<div class="history-panel" id="historyPanel">
  <div class="history-top">
    <div class="back-btn" id="closeHistory">‹</div>
    <h2>History</h2>
  </div>
  <div class="cat-breakdown" id="catBreakdown"></div>
  <div class="list-header">
    <h2>All entries</h2>
    <input type="text" id="search" placeholder="Search...">
  </div>
<div class="entries" id="entries"></div>
</div>

<div id="modalRoot"></div>

<script>
  const STORAGE_KEY = "expense_tracker_entries_v1";
  const THEME_KEY = "expense_tracker_theme_v1";
  const CATEGORY_KEY = "expense_tracker_categories_v1";
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let selectedMode = "GPay";

  const DEFAULT_CATEGORIES = ["Food","Groceries","Shopping","Bills","Medical - Amma","Pavithra","Entertainment","Unnecessary spendings","Other"];
  let categories = JSON.parse(localStorage.getItem(CATEGORY_KEY) || "null") || DEFAULT_CATEGORIES.slice();

  function saveCategories(){
    localStorage.setItem(CATEGORY_KEY, JSON.stringify(categories));
  }

  function addCategoryIfNew(cat){
    const trimmed = (cat || "").trim();
    if (!trimmed) return;
    const exists = categories.some(c => c.toLowerCase() === trimmed.toLowerCase());
    if (!exists){
      categories.push(trimmed);
      saveCategories();
    }
  }

  function populateCategorySelect(selectedValue){
    categoryInput.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")
      + `<option value="__add_new__">＋ Add new category</option>`;
    if (selectedValue) categoryInput.value = selectedValue;
  }


  const themeSwitch = document.getElementById("themeSwitch");
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme === "light") document.body.classList.add("light");
  themeSwitch.addEventListener("click", () => {
    document.body.classList.toggle("light");
    localStorage.setItem(THEME_KEY, document.body.classList.contains("light") ? "light" : "dark");
  });

  const dateInput = document.getElementById("date");
  const amountInput = document.getElementById("amount");
  const noteInput = document.getElementById("note");
  const categoryInput = document.getElementById("category");
  categoryInput.addEventListener("change", async () => {
    if (categoryInput.value === "__add_new__"){
      const val = await showPrompt("New category name", "e.g. Fuel, Rent...");
      if (val){
        addCategoryIfNew(val);
        populateCategorySelect(val);
      } else {
        populateCategorySelect(categories[0]);
      }
    }
  });
  const form = document.getElementById("entryForm");
  const modeGroup = document.getElementById("modeGroup");
  const entriesEl = document.getElementById("entries");
  const searchInput = document.getElementById("search");
  const openHistoryBtn = document.getElementById("openHistory");
  const closeHistoryBtn = document.getElementById("closeHistory");
  const historyPanel = document.getElementById("historyPanel");

  openHistoryBtn.addEventListener("click", () => {
    historyPanel.classList.add("open");
  });
  closeHistoryBtn.addEventListener("click", () => {
    historyPanel.classList.remove("open");
  });

  function exportBackup(){
    const blob = new Blob([JSON.stringify(entries, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `expense-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById("mainBackupBtn").addEventListener("click", exportBackup);

  function handleImportFile(file){
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const imported = JSON.parse(evt.target.result);
        if (!Array.isArray(imported)) throw new Error("Invalid file");
        const merge = await showConfirm(
          `Found ${imported.length} entries in this backup. Merge with your current data, or replace it entirely?`,
          "Merge",
          "Replace"
        );
        if (merge){
          const existingIds = new Set(entries.map(en => en.id));
          imported.forEach(en => {
            if (!existingIds.has(en.id)) entries.push(en);
          });
        } else {
          entries = imported;
        }
        save();
        render();
        await showAlert("Backup restored successfully.");
      } catch (err){
        await showAlert("Couldn't read that file. Please choose a valid backup JSON file.");
      }
    };
    reader.readAsText(file);
  }

  const mainImportBtn = document.getElementById("mainImportBtn");
  const mainImportFile = document.getElementById("mainImportFile");
  mainImportBtn.addEventListener("click", () => {
    mainImportFile.click();
  });
  mainImportFile.addEventListener("change", (e) => {
    handleImportFile(e.target.files[0]);
    mainImportFile.value = "";
  });

  // default date = today
  dateInput.value = new Date().toISOString().slice(0,10);

  modeGroup.addEventListener("click", (e) => {
    const btn = e.target.closest(".mode-btn");
    if (!btn) return;
    selectedMode = btn.dataset.mode;
    [...modeGroup.children].forEach(b => b.classList.toggle("selected", b === btn));
  });

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function showAlert(message){
    return new Promise((resolve) => {
      const root = document.getElementById("modalRoot");
      root.innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box">
            <p>${escapeHtml(message)}</p>
            <div class="modal-actions">
              <button class="m-single" id="modalOk">OK</button>
            </div>
          </div>
        </div>`;
      document.getElementById("modalOk").addEventListener("click", () => {
        root.innerHTML = "";
        resolve();
      });
    });
  }

  function showConfirm(message, okLabel, cancelLabel){
    return new Promise((resolve) => {
      const root = document.getElementById("modalRoot");
      root.innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box">
            <p>${escapeHtml(message)}</p>
            <div class="modal-actions">
              <button class="m-secondary" id="modalCancel">${escapeHtml(cancelLabel || "Cancel")}</button>
              <button class="m-primary" id="modalOk">${escapeHtml(okLabel || "OK")}</button>
            </div>
          </div>
        </div>`;
      document.getElementById("modalOk").addEventListener("click", () => {
        root.innerHTML = "";
        resolve(true);
      });
      document.getElementById("modalCancel").addEventListener("click", () => {
        root.innerHTML = "";
        resolve(false);
      });
    });
  }

  function showPrompt(message, placeholder){
    return new Promise((resolve) => {
      const root = document.getElementById("modalRoot");
      root.innerHTML = `
        <div class="modal-overlay">
          <div class="modal-box">
            <p>${escapeHtml(message)}</p>
            <input type="text" id="promptInput" placeholder="${escapeHtml(placeholder || "")}" style="margin-bottom:16px;">
            <div class="modal-actions">
              <button class="m-secondary" id="modalCancel">Cancel</button>
              <button class="m-primary" id="modalOk">Add</button>
            </div>
          </div>
        </div>`;
      const input = document.getElementById("promptInput");
      input.focus();
      document.getElementById("modalOk").addEventListener("click", () => {
        const val = input.value.trim();
        root.innerHTML = "";
        resolve(val || null);
      });
      document.getElementById("modalCancel").addEventListener("click", () => {
        root.innerHTML = "";
        resolve(null);
      });
    });
  }

  function fmt(n){
    return "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits:2});
  }

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function monthStr(d){ return d.slice(0,7); }

  function render(){
    const q = searchInput.value.trim().toLowerCase();
    const filtered = entries.filter(e => !q || e.note.toLowerCase().includes(q) || e.mode.toLowerCase().includes(q) || (e.category || "").toLowerCase().includes(q));
    const sorted = [...filtered].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);

    // totals always from full entries (not filtered)
    const totalAll = entries.reduce((s,e) => s + e.amount, 0);
    const tMonth = monthStr(todayStr());
    const totalMonth = entries.filter(e => monthStr(e.date) === tMonth).reduce((s,e) => s + e.amount, 0);
    const totalToday = entries.filter(e => e.date === todayStr()).reduce((s,e) => s + e.amount, 0);

    document.getElementById("totalAll").textContent = fmt(totalAll);
    document.getElementById("totalCount").textContent = entries.length + (entries.length === 1 ? " entry" : " entries");
    document.getElementById("totalMonth").textContent = fmt(totalMonth);
    document.getElementById("totalToday").textContent = fmt(totalToday);
    document.getElementById("historyCount").textContent = entries.length + (entries.length === 1 ? " entry" : " entries");
    renderCategoryBreakdown(totalAll);

    entriesEl.innerHTML = "";

    if (sorted.length === 0){
      entriesEl.innerHTML = `<div class="empty">No expenses yet. Add your first one above.</div>`;
      return;
    }

    // group by date
    const groups = {};
    sorted.forEach(e => {
      groups[e.date] = groups[e.date] || [];
      groups[e.date].push(e);
    });

    Object.keys(groups).forEach(date => {
      const dayTotal = groups[date].reduce((s,e) => s + e.amount, 0);
      const dayEl = document.createElement("div");
      dayEl.className = "day-group";
      const label = document.createElement("div");
      label.className = "day-label";
      label.innerHTML = `<span>${formatDate(date)}</span><span>${fmt(dayTotal)}</span>`;
      dayEl.appendChild(label);

      groups[date].forEach(e => {
        const row = document.createElement("div");
        row.className = "entry";
        row.innerHTML = `
          <div class="dot ${e.mode}"></div>
          <div class="info">
            <div class="note">${escapeHtml(e.note)}</div>
            <div class="meta"><span class="cat">${escapeHtml(e.category || "Other")}</span><span>${e.mode}</span></div>
          </div>
          <div class="amount">${fmt(e.amount)}</div>
          <div class="del" data-id="${e.id}">✕</div>
        `;
        dayEl.appendChild(row);
      });

      entriesEl.appendChild(dayEl);
    });
  }

  function renderCategoryBreakdown(totalAll){
    const catBreakdown = document.getElementById("catBreakdown");
    if (entries.length === 0){
      catBreakdown.innerHTML = "";
      return;
    }
    const sums = {};
    entries.forEach(e => {
      const c = e.category || "Other";
      sums[c] = (sums[c] || 0) + e.amount;
    });
    const rows = Object.keys(sums)
      .map(c => ({ name: c, amt: sums[c] }))
      .sort((a,b) => b.amt - a.amt);

    catBreakdown.innerHTML = rows.map(r => {
      const pct = totalAll > 0 ? (r.amt / totalAll * 100) : 0;
      return `
        <div class="cat-row">
          <div style="flex:1; min-width:0;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="cat-name">${escapeHtml(r.name)}</span>
              <span class="cat-right">
                <span class="cat-amt">${fmt(r.amt)}</span>
                <span class="cat-pct">${pct.toFixed(0)}%</span>
              </span>
            </div>
            <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%"></div></div>
          </div>
        </div>
      `;
    }).join("");
  }

  function formatDate(d){
    const dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"});
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  entriesEl.addEventListener("click", (e) => {
    const del = e.target.closest(".del");
    if (!del) return;
    const id = Number(del.dataset.id);
    entries = entries.filter(en => en.id !== id);
    save();
    render();
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const amount = parseFloat(amountInput.value);
    if (!amount || amount <= 0) return;
    entries.push({
      id: Date.now(),
      date: dateInput.value || todayStr(),
      amount: amount,
      note: noteInput.value.trim() || "Expense",
      category: categoryInput.value.trim() || "Other",
      mode: selectedMode
    });
    addCategoryIfNew(categoryInput.value);
    save();
    noteInput.value = "";
    amountInput.value = "";
    amountInput.focus();
    render();
  });

  searchInput.addEventListener("input", render);

  populateCategorySelect();
  render();
</script>
</body>
</html>
