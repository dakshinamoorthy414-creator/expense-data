<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Expenses</title>
<style>
  :root{
    --bg:#14171c;
    --card:#1c2029;
    --card-2:#20242e;
    --line:#2a2f3a;
    --text:#e9ebef;
    --muted:#8a90a0;
    --accent:#4dd6a8;
    --accent-dim:#2c5d4d;
    --cash:#e0a95c;
    --gpay:#5c9ee0;
    --paytm:#5cc2e0;
    --slice:#e05ca0;
    --other:#a08ce0;
    --danger:#e0605c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:40px;
  }
  header{
    padding:22px 20px 14px;
    position:sticky; top:0;
    background:var(--bg);
    z-index:5;
    border-bottom:1px solid var(--line);
  }
  header h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.2px;
  }
  header p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:13px;
  }

  .totals{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:14px 20px 4px;
  }
  .total-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
  }
  .total-card.main{
    grid-column:1 / -1;
    background:linear-gradient(135deg, var(--card) 0%, var(--card-2) 100%);
    border-color:var(--accent-dim);
  }
  .total-card .label{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .total-card .value{
    font-size:18px;
    font-weight:700;
    margin-top:2px;
  }
  .total-card.main .value{
    font-size:22px;
    color:var(--accent);
  }
  .total-card .sub{
    font-size:11px;
    color:var(--muted);
    margin-top:1px;
  }

  form{
    margin:18px 20px 6px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
  }
  .row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
  }
  .field{flex:1 1 0; width:0; display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
  input, select{
    background:var(--card-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:10px;
    padding:8px 10px;
    font-size:14px;
    width:100%;
    font-family:inherit;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}

  #date{
    padding:6px 8px;
    font-size:13px;
  }

  .mode-group{display:flex; gap:8px; flex-wrap:wrap;}
  .mode-btn{
    flex:1 1 30%;
    min-width:80px;
    padding:10px 6px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card-2);
    color:var(--muted);
    font-size:13.5px;
    text-align:center;
    cursor:pointer;
    font-weight:600;
  }
  .mode-btn.selected[data-mode="GPay"]{background:rgba(92,158,224,0.15); border-color:var(--gpay); color:var(--gpay);}
  .mode-btn.selected[data-mode="Cash"]{background:rgba(224,169,92,0.15); border-color:var(--cash); color:var(--cash);}
  .mode-btn.selected[data-mode="Paytm"]{background:rgba(92,194,224,0.15); border-color:var(--paytm); color:var(--paytm);}
  .mode-btn.selected[data-mode="Slice"]{background:rgba(224,92,160,0.15); border-color:var(--slice); color:var(--slice);}
  .mode-btn.selected[data-mode="Other"]{background:rgba(160,140,224,0.15); border-color:var(--other); color:var(--other);}

  .add-btn{
    width:100%;
    margin-top:6px;
    padding:13px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#0d1410;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
  }
  .add-btn:active{opacity:0.85;}

  .history-btn{
    width:calc(100% - 40px);
    margin:14px 20px 0;
    padding:13px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--card);
    color:var(--text);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .history-btn .count{
    background:var(--card-2);
    color:var(--muted);
    font-size:12px;
    padding:2px 8px;
    border-radius:20px;
  }

  .history-panel{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:var(--bg);
    z-index:20;
    transform:translateX(100%);
    transition:transform 0.25s ease;
    overflow-y:auto;
  }
  .history-panel.open{transform:translateX(0);}
  .history-top{
    position:sticky;
    top:0;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:18px 20px 12px;
    display:flex;
    align-items:center;
    gap:12px;
    z-index:2;
  }
  .back-btn{
    width:34px; height:34px;
    border-radius:10px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--text);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .history-top h2{margin:0; font-size:18px; font-weight:700;}

  .list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:16px 20px 8px;
  }
  .list-header h2{font-size:15px; margin:0; color:var(--muted); font-weight:600; letter-spacing:0.3px;}
  .list-header input{
    width:auto;
    max-width:130px;
    font-size:13px;
    padding:7px 10px;
  }

  .entries{margin:0 20px;}
  .day-group{margin-bottom:14px;}
  .day-label{
    font-size:12px;
    color:var(--muted);
    margin:10px 0 6px;
    display:grid;
    grid-template-columns:8px minmax(0,1fr) minmax(58px,auto) 20px;
    align-items:center;
    column-gap:10px;
  }
  .day-label span:first-child{grid-column:2;}
  .day-label span:last-child{grid-column:3; text-align:right; font-variant-numeric:tabular-nums;}
  .entry{
    display:grid;
    grid-template-columns:8px minmax(0,1fr) minmax(58px,auto) 20px;
    align-items:center;
    column-gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .entry .dot{
    width:8px; height:8px; border-radius:50%;
    flex-shrink:0;
  }
  .dot.GPay{background:var(--gpay);}
  .dot.Cash{background:var(--cash);}
  .dot.Paytm{background:var(--paytm);}
  .dot.Slice{background:var(--slice);}
  .dot.Other{background:var(--other);}
  .entry .info{min-width:0;}
  .entry .info .note{font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry .info .meta{font-size:12px; color:var(--muted); margin-top:2px; display:flex; align-items:center; gap:6px;}
  .entry .info .meta .cat{
    background:var(--card-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:1px 7px;
    border-radius:6px;
    font-size:11px;
    font-weight:600;
  }
  .entry .amount{
    font-size:15.5px;
    font-weight:700;
    text-align:right;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .entry .del{
    color:var(--danger);
    font-size:18px;
    text-align:center;
    cursor:pointer;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:40px 20px;
  }
</style>
</head>
<body>

<header>
  <h1>Expenses</h1>
  <p>Track what you spend, saved on this device</p>
</header>

<div class="totals">
  <div class="total-card main">
    <div class="label">Total spent</div>
    <div class="value" id="totalAll">₹0</div>
    <div class="sub" id="totalCount">0 entries</div>
  </div>
  <div class="total-card">
    <div class="label">This month</div>
    <div class="value" id="totalMonth">₹0</div>
  </div>
  <div class="total-card">
    <div class="label">Today</div>
    <div class="value" id="totalToday">₹0</div>
  </div>
</div>

<form id="entryForm">
  <div class="row">
    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date" required>
    </div>
    <div class="field">
      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" class="amount-input" placeholder="0" min="0" step="0.01" inputmode="decimal" required>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="category">Category</label>
      <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Groceries</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Health</option>
        <option>Entertainment</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field">
      <label for="note">Details</label>
      <input type="text" id="note" placeholder="e.g. Lunch, groceries..." required>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>Paid via</label>
      <div class="mode-group" id="modeGroup">
        <div class="mode-btn selected" data-mode="GPay">GPay</div>
        <div class="mode-btn" data-mode="Cash">Cash</div>
        <div class="mode-btn" data-mode="Paytm">Paytm</div>
        <div class="mode-btn" data-mode="Slice">Slice</div>
        <div class="mode-btn" data-mode="Other">Other</div>
      </div>
    </div>
  </div>
  <button type="submit" class="add-btn">Add expense</button>
</form>

<button class="history-btn" id="openHistory">
  📋 View History <span class="count" id="historyCount">0 entries</span>
</button>

<div class="history-panel" id="historyPanel">
  <div class="history-top">
    <div class="back-btn" id="closeHistory">‹</div>
    <h2>History</h2>
  </div>
  <div class="list-header">
    <h2>All entries</h2>
    <input type="text" id="search" placeholder="Search...">
  </div>
  <div class="entries" id="entries"></div>
</div>

<script>
  const STORAGE_KEY = "expense_tracker_entries_v1";
  let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let selectedMode = "GPay";

  const dateInput = document.getElementById("date");
  const amountInput = document.getElementById("amount");
  const noteInput = document.getElementById("note");
  const categoryInput = document.getElementById("category");
  const form = document.getElementById("entryForm");
  const modeGroup = document.getElementById("modeGroup");
  const entriesEl = document.getElementById("entries");
  const searchInput = document.getElementById("search");
  const openHistoryBtn = document.getElementById("openHistory");
  const closeHistoryBtn = document.getElementById("closeHistory");
  const historyPanel = document.getElementById("historyPanel");

  openHistoryBtn.addEventListener("click", () => {
    historyPanel.classList.add("open");
  });
  closeHistoryBtn.addEventListener("click", () => {
    historyPanel.classList.remove("open");
  });

  // default date = today
  dateInput.value = new Date().toISOString().slice(0,10);

  modeGroup.addEventListener("click", (e) => {
    const btn = e.target.closest(".mode-btn");
    if (!btn) return;
    selectedMode = btn.dataset.mode;
    [...modeGroup.children].forEach(b => b.classList.toggle("selected", b === btn));
  });

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function fmt(n){
    return "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits:2});
  }

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function monthStr(d){ return d.slice(0,7); }

  function render(){
    const q = searchInput.value.trim().toLowerCase();
    const filtered = entries.filter(e => !q || e.note.toLowerCase().includes(q) || e.mode.toLowerCase().includes(q) || (e.category || "").toLowerCase().includes(q));
    const sorted = [...filtered].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);

    // totals always from full entries (not filtered)
    const totalAll = entries.reduce((s,e) => s + e.amount, 0);
    const tMonth = monthStr(todayStr());
    const totalMonth = entries.filter(e => monthStr(e.date) === tMonth).reduce((s,e) => s + e.amount, 0);
    const totalToday = entries.filter(e => e.date === todayStr()).reduce((s,e) => s + e.amount, 0);

    document.getElementById("totalAll").textContent = fmt(totalAll);
    document.getElementById("totalCount").textContent = entries.length + (entries.length === 1 ? " entry" : " entries");
    document.getElementById("totalMonth").textContent = fmt(totalMonth);
    document.getElementById("totalToday").textContent = fmt(totalToday);
    document.getElementById("historyCount").textContent = entries.length + (entries.length === 1 ? " entry" : " entries");

    entriesEl.innerHTML = "";

    if (sorted.length === 0){
      entriesEl.innerHTML = `<div class="empty">No expenses yet. Add your first one above.</div>`;
      return;
    }

    // group by date
    const groups = {};
    sorted.forEach(e => {
      groups[e.date] = groups[e.date] || [];
      groups[e.date].push(e);
    });

    Object.keys(groups).forEach(date => {
      const dayTotal = groups[date].reduce((s,e) => s + e.amount, 0);
      const dayEl = document.createElement("div");
      dayEl.className = "day-group";
      const label = document.createElement("div");
      label.className = "day-label";
      label.innerHTML = `<span>${formatDate(date)}</span><span>${fmt(dayTotal)}</span>`;
      dayEl.appendChild(label);

      groups[date].forEach(e => {
        const row = document.createElement("div");
        row.className = "entry";
        row.innerHTML = `
          <div class="dot ${e.mode}"></div>
          <div class="info">
            <div class="note">${escapeHtml(e.note)}</div>
            <div class="meta"><span class="cat">${escapeHtml(e.category || "Other")}</span><span>${e.mode}</span></div>
          </div>
          <div class="amount">${fmt(e.amount)}</div>
          <div class="del" data-id="${e.id}">✕</div>
        `;
        dayEl.appendChild(row);
      });

      entriesEl.appendChild(dayEl);
    });
  }

  function formatDate(d){
    const dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"});
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  entriesEl.addEventListener("click", (e) => {
    const del = e.target.closest(".del");
    if (!del) return;
    const id = Number(del.dataset.id);
    entries = entries.filter(en => en.id !== id);
    save();
    render();
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const amount = parseFloat(amountInput.value);
    if (!amount || amount <= 0) return;
    entries.push({
      id: Date.now(),
      date: dateInput.value || todayStr(),
      amount: amount,
      note: noteInput.value.trim() || "Expense",
      category: categoryInput.value,
      mode: selectedMode
    });
    save();
    noteInput.value = "";
    amountInput.value = "";
    amountInput.focus();
    render();
  });

  searchInput.addEventListener("input", render);

  render();
</script>
</body>
</html>
